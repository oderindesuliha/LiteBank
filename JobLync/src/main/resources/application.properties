spring.application.name=JobLync

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/joblync}
spring.datasource.username=${DB_USERNAME:joblync}
spring.datasource.password=${DB_PASSWORD:joblync}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:5B0970DFF635D80A4E9B2D9E8F4A7C3B1F2E4D7A9C0B3E6F8A1D5C9E2F7A4B8C}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.algorithm=${JWT_ALGORITHM:HS512}
jwt.issuer=${JWT_ISSUER:JobLync}
jwt.audience=${JWT_AUDIENCE:JobLyncUsers}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true